{% extends 'loja/base.html' %}{% block content %}<section class="login card"><h1>Entrar no sistema</h1><p>Acesse a gestão do seu comércio.</p>{% if form.errors %}<p role="alert" class="erro">Usuário ou senha inválidos.</p>{% endif %}<form method="post">{% csrf_token %}<label for="id_username">Usuário</label><input id="id_username" name="username" required autofocus><label for="id_password">Senha</label><input id="id_password" name="password" type="password" required><button>Entrar</button></form></section>{% endblock %}
